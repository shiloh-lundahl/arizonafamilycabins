services:
  - type: web
    name: arizonafamilycabins
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PHONE_NUMBER
        value: "(602) 430-2232"   # Karen (assistant) — bookings via call/text
      - key: HUBSPOT_API_KEY
        value: ""   # fill in after creating HubSpot account (optional)
      # Airbnb iCal export URLs (the "sync calendar" links) — set privately in the
      # Render dashboard (Environment tab), NOT committed here, since they are secret feeds.
      - key: AIRBNB_ICAL_PARKWAY
        sync: false
      - key: AIRBNB_ICAL_MOHAVE
        sync: false
      - key: VRBO_ICAL_PARKWAY
        sync: false
      - key: VRBO_ICAL_MOHAVE
        sync: false
      # Gmail SMTP for sending lead-notification + guest-confirmation emails
      # directly (replaces FormSubmit, which is blocked by Cloudflare from
      # Render's IPs — see app.py comments). Set privately in the Render
      # dashboard (Environment tab), NOT committed here.
      # GMAIL_SMTP_USER = Shilohsassistant@gmail.com
      # GMAIL_SMTP_APP_PASSWORD = a Google "App Password" for that account
      #   (generate at myaccount.google.com/apppasswords, requires 2-Step
      #   Verification enabled on the account first)
      - key: GMAIL_SMTP_USER
        sync: false
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false
      # No DATABASE_URL set on purpose — the app falls back to local SQLite and
      # reloads all page content from committed files on every startup, so this
      # site needs no separate (card-required) Postgres database to serve pages.
      # (The web service itself is on the paid Starter plan so it never sleeps —
      # only the database was being avoided to skip the card requirement.)
